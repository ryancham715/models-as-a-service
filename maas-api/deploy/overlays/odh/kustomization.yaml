apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: maas-api-opendatahub

# Overlay used by the Tenant reconciler (maas-controller) to render maas-api
# platform workloads. All dynamic value injection (images, gateway config,
# namespace, audience) is handled by PostRender in Go code after kustomize build.
resources:
- ../../../../deployment/base/maas-api/overlays/tls
- ../../../../deployment/base/maas-controller/policies

# payload-processing is intentionally excluded here: it is now installed by
# ai-gateway-controller instead of maas-controller's TenantReconciler. See
# ai-gateway-controller's DESIGN.md. maas-controller does not garbage-collect
# resources that fall out of this render set, so any previously-applied
# payload-processing/payload-pre-processing/EnvoyFilter/RBAC objects must be
# deleted manually as a separate step.

namespace: opendatahub

labels:
- pairs:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: maas-api
